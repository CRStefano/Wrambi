    <script>
      // Applica subito il tema salvato, prima del primo disegno, per evitare lampi.
      try {
        var t = localStorage.getItem('wrambi:theme');
        if (t === 'system' || !t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
